<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man Maze</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <main class="game-page">
    <section class="level-row" aria-label="Choose level">
      <button class="level active" data-level="easy">EASY<small>1 GHOST</small></button>
      <button class="level" data-level="medium">MEDIUM<small>2 GHOSTS</small></button>
      <button class="level" data-level="hard">HARD<small>3 GHOSTS</small></button>
    </section>

    <section class="scorebar" aria-label="Score">
      <div><small>SCORE</small><strong id="score">000000</strong></div>
      <div><small>HIGH SCORE</small><strong id="highScore">000000</strong></div>
      <div><small>LIVES</small><strong id="lives">● ● ●</strong></div>
    </section>

    <div class="board-wrap"><canvas id="gameCanvas" aria-label="Pac-Man maze"></canvas><div class="message" id="message"><strong id="messageTitle">READY?</strong><button class="start-button" id="startButton">PLAY GAME</button></div></div>
  </main>
  <script src="app.js?v=2"></script>
</body>
</html>
